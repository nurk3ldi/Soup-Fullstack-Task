# Runtime hardening shared by the API containers: no root filesystem writes, no Linux
# capabilities, no privilege escalation, bounded processes and memory.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 512m

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}   # local default; set it for anything shared
      POSTGRES_DB: tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Port intentionally not published: only the api and tests containers need the database.
    security_opt:
      - no-new-privileges:true

  api:
    <<: *hardening
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD:-tracker}@db:5432/tracker
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      TEST_MODE: "0"
      # Scaling knobs (defaults = what the tests and results/load.txt were run with).
      # More than one worker REQUIRES a STREAM_SECRET, or stream tokens minted by one worker are
      # rejected by the others.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      STREAM_SECRET: ${STREAM_SECRET:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      # Per process. Requests per second one project may make, and failed credentials one client
      # address may present (burst, then refill per second). 0 switches a limit off.
      RATE_LIMIT_PROJECT_RPS: ${RATE_LIMIT_PROJECT_RPS:-600}
      RATE_LIMIT_AUTH_FAIL_BURST: ${RATE_LIMIT_AUTH_FAIL_BURST:-20}
      RATE_LIMIT_AUTH_FAIL_RPS: ${RATE_LIMIT_AUTH_FAIL_RPS:-1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Published on localhost only. The defaults (admin token, database password) are public,
      # so the service must not be reachable from the network until they are changed:
      #   API_BIND=0.0.0.0 ADMIN_TOKEN=... POSTGRES_PASSWORD=... docker compose up -d
      - "${API_BIND:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      # Each check starts a Python interpreter (~0.1 s of CPU). Every 2 s that showed up as
      # 10-40 % CPU in `docker stats` on an idle container, so: fast only while starting.
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

  # Same image and database as `api`, but with the test-only hooks enabled (fault injection,
  # debug endpoints). Only started for the test suite; never published to the host.
  api-test:
    <<: *hardening
    profiles: ["tests"]
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD:-tracker}@db:5432/tracker
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      TEST_MODE: "1"
      SSE_STALL_SECONDS: "2"   # production default is 10; shortened so the overflow test is quick
      SSE_PING_SECONDS: "1"    # production default is 15; shortened so stale-connection tests are quick
      SSE_MAX_STREAMS_PER_PROJECT: "10"   # production default is 100; lowered so the cap test is quick
      # Rate limits are off here: the suite fires thousands of requests, many with bad keys on
      # purpose, from one address. tests/test_ratelimit.py switches them on through a debug hook
      # and also checks that the plain `api` service has them on by default.
      RATE_LIMIT_PROJECT_RPS: "0"
      RATE_LIMIT_AUTH_FAIL_BURST: "0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      # Each check starts a Python interpreter (~0.1 s of CPU). Every 2 s that showed up as
      # 10-40 % CPU in `docker stats` on an idle container, so: fast only while starting.
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

  tests:
    profiles: ["tests"]
    build:
      context: .
      target: tests
    environment:
      API_URL: http://api-test:8000          # TEST_MODE=1
      PLAIN_API_URL: http://api:8000         # TEST_MODE off, to prove the hooks are inert there
      DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD:-tracker}@db:5432/tracker
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      api:
        condition: service_healthy
      api-test:
        condition: service_healthy
    volumes:
      - ./tests:/srv/tests
      - ./loadtest:/srv/loadtest
      - ./results:/srv/results

volumes:
  pgdata:
